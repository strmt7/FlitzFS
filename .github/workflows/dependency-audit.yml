name: Official dependency release inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/ci/dependency_audit.py'
      - 'tools/ci/hosted_semantic.py'
      - 'tools/ci/test_hosted_semantic.py'
      - 'tools/ci/prepare_hosted_tools.py'
      - 'tools/ci/test_hosted_tools.py'
      - 'CMakeLists.txt'
      - 'third_party/**'
permissions:
  contents: read
jobs:
  native-api-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use current stable Python for build tooling
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          check-latest: true
      - name: Verify owned-fixture tool provisioning guards
        run: python tools/ci/test_hosted_tools.py
      - name: Stage official checksum-pinned CMake
        run: python tools/ci/prepare_hosted_tools.py cmake
      - name: Stage current official LLVM CPU tools on Linux
        if: runner.os == 'Linux'
        run: python tools/ci/prepare_hosted_tools.py llvm
      - name: Retain exact tool provisioning evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-${{ github.job }}-${{ runner.os }}-${{ strategy.job-index || 0 }}-${{ github.sha }}
          path: ${{ runner.temp }}/flitzfs-*-provision.json
          retention-days: 14
          if-no-files-found: warn
      - name: Capture exact release identities and installed tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/dependency_audit.py --output "${{ runner.temp }}/flitzfs-dependency-audit"
      - name: Retain native successes and access failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ github.sha }}
          path: ${{ runner.temp }}/flitzfs-dependency-audit
          if-no-files-found: error
          retention-days: 30
