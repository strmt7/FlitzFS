name: Isolated source research (no owner-PC execution)
on:
  push:
    branches: [main]
    paths:
      - 'tools/ci/hosted_research.py'
      - '.github/workflows/hosted-research.yml'
permissions:
  contents: read
jobs:
  admitted-crawler:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Stage reviewed provider source in an isolated checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: strmt7/FlitzZip
          ref: 4e6a1bb0d144611a09dcbc65276faa676e923882
          path: .ci-provider
          sparse-checkout: |
            tools
            third_party/upstream/crawl4ai
            third_party/upstream/nltk
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install browser OS prerequisites on this disposable VM only
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libnspr4 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64
      - name: Provision hash-locked provider with hard process-tree budgets
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(df -B1 --output=avail "$RUNNER_TEMP" | tail -1)" -gt 4294967296
          python_path="$(command -v python)"
          sudo systemd-run --wait --collect --pipe --service-type=exec \
            --uid="$(id -u)" --property=MemoryMax=3G --property=MemorySwapMax=0 \
            --property=CPUQuota=200% --property=TasksMax=256 --property=RuntimeMaxSec=900 \
            --setenv="PIP_CACHE_DIR=$RUNNER_TEMP/flitzfs-pip-cache" \
            --setenv="LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" \
            "$python_path" "$GITHUB_WORKSPACE/.ci-provider/tools/crawl4ai_tool.py" \
            --home "$RUNNER_TEMP/flitzfs-admitted-crawler" install
      - name: Read exact durability/integrity sources with native receipts
        shell: bash
        run: |
          set -euo pipefail
          python_path="$(command -v python)"
          sudo systemd-run --wait --collect --pipe --service-type=exec \
            --uid="$(id -u)" --property=MemoryMax=3G --property=MemorySwapMax=0 \
            --property=CPUQuota=200% --property=TasksMax=256 --property=RuntimeMaxSec=360 \
            --setenv=GITHUB_ACTIONS=true --setenv=RUNNER_ENVIRONMENT=github-hosted \
            --setenv="GITHUB_SHA=$GITHUB_SHA" --setenv="LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" \
            "$python_path" "$GITHUB_WORKSPACE/tools/ci/hosted_research.py" \
            --provider "$GITHUB_WORKSPACE/.ci-provider" --home "$RUNNER_TEMP/flitzfs-admitted-crawler" \
            --output "$RUNNER_TEMP/flitzfs-durability-sources"
      - name: Retain native captures and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-${{ github.sha }}
          path: ${{ runner.temp }}/flitzfs-durability-sources
          if-no-files-found: warn
          retention-days: 30
