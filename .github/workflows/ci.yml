name: Safe CPU and native callback checks
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            zstd: 'ON'
          - os: ubuntu-24.04
            zstd: 'OFF'
          - os: windows-2022
            zstd: 'OFF'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install CPU Zstandard headers
        if: runner.os == 'Linux' && matrix.zstd == 'ON'
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev
      - name: Configure
        run: cmake -S . -B build -DFLITZFS_WITH_ZSTD=${{ matrix.zstd }} -DFLITZFS_REQUIRE_ZSTD=${{ matrix.zstd }} -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 45 --parallel 1
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install CPU dependencies
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev clang
      - name: Configure ASan/UBSan
        run: >-
          cmake -S . -B build-asan -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug -DFLITZFS_REQUIRE_ZSTD=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan --parallel 2
      - name: Check with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure --timeout 45 --parallel 1
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Stage checksum-pinned SDK without installation
        shell: pwsh
        run: ./tools/ci/prepare_winfsp_sdk.ps1
      - name: Check out pinned Zstandard source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: meta/zstd
          ref: f8745da6ff1ad1e7bab384bd1f9d742439278e99 # v1.5.7
          path: .ci-deps/zstd
          persist-credentials: false
      - name: Build pinned CPU codec and native callbacks
        shell: pwsh
        run: |
          cmake -S .ci-deps/zstd/build/cmake -B .ci-deps/zstd-build -A x64 -DZSTD_BUILD_PROGRAMS=OFF -DZSTD_BUILD_TESTS=OFF -DZSTD_BUILD_SHARED=OFF -DZSTD_BUILD_STATIC=ON -DZSTD_MULTITHREAD_SUPPORT=OFF
          if ($LASTEXITCODE) { throw 'Zstandard configure failed' }
          cmake --build .ci-deps/zstd-build --config Release --parallel 2
          if ($LASTEXITCODE) { throw 'Zstandard build failed' }
          $libraries = @(Get-ChildItem .ci-deps/zstd-build -Filter zstd_static.lib -Recurse -File)
          if ($libraries.Count -ne 1) { throw 'Expected one pinned static Zstandard library' }
          $headers = (Resolve-Path .ci-deps/zstd/lib).Path
          cmake -S . -B build-native -A x64 -DFLITZFS_REQUIRE_ZSTD=ON -DFLITZFS_BUILD_WINFSP=ON "-DFLITZFS_WINFSP_SDK=$env:FLITZFS_WINFSP_SDK" "-DFLITZFS_ZSTD_INCLUDE=$headers" "-DFLITZFS_ZSTD_LIBRARY=$($libraries[0].FullName)"
          if ($LASTEXITCODE) { throw 'Native configure failed' }
          cmake --build build-native --config Release --parallel 2
          if ($LASTEXITCODE) { throw 'Native build failed' }
      - name: Exercise actual callbacks without a mounted filesystem
        run: ctest --test-dir build-native -C Release --output-on-failure --timeout 45 --parallel 1
