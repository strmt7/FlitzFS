name: Pinned ROCm SDK compile qualification (no GPU)
on:
  workflow_dispatch:
    inputs:
      codec_candidate:
        description: Compile the reviewed hipCOMP LZ4 translation unit without loading it
        type: boolean
        required: false
        default: false
      native_sync_candidate:
        description: Also compile the explicit native-wave variant and CPU index oracle; requires codec_candidate
        type: boolean
        required: false
        default: false
      link_candidate:
        description: Link the separate private typed module without loading it; requires both candidate flags
        type: boolean
        required: false
        default: false
      cpu_lz4:
        description: Stage and statically qualify independent CPU decoding in the SDK worker; requires link_candidate
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'tools/rocm-sdk-lock.json'
      - 'tools/ci/qualify_rocm_sdk.py'
      - 'tools/ci/stage_lz4_worker_decoder.py'
      - 'tools/ci/test_lz4_worker_decoder.py'
      - 'tools/ci/qualify_warp_sync.py'
      - 'tools/ci/test_warp_sync_probe.py'
      - 'tools/ci/qualify_hipcomp_candidate.py'
      - 'tools/ci/hipcomp_native_sync.py'
      - 'tools/ci/hipcomp_lz4_entry.py'
      - 'tools/ci/test_hipcomp_lz4_entry.py'
      - 'tools/ci/test_hipcomp_native_sync.py'
      - 'tools/ci/test_hipcomp_candidate.py'
      - 'tools/ci/hip_runtime_exports.py'
      - 'tools/ci/test_hip_runtime_exports.py'
      - 'tests/rocm_compile/**'
      - 'tests/gpu_probe_budget.hpp'
      - 'src/windows/hip_*'
      - 'tools/ci/stage_hip_worker_bundle.py'
      - 'tools/ci/check_portable_cpu.py'
      - 'src/gpu/**'
      - 'include/flitzfs/object_store.hpp'
      - 'include/flitzfs/gpu_batch.hpp'
      - 'include/flitzfs/gpu_match.hpp'
      - 'src/gpu_batch.cpp'
      - 'src/gpu_match.cpp'
      - 'src/windows/gpu_budget.*'
      - 'include/flitzfs/gpu_protocol.hpp'
      - 'include/flitzfs/gpu_kernel_api.hpp'
      - '.github/workflows/hip-compile.yml'
permissions:
  contents: read
jobs:
  complete-rocm-compile:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage current reviewed FlitzZip toolchain mechanisms unchanged
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: strmt7/FlitzZip
          ref: b46acb6dd7e48e1fb2dc182210495abb6a3c013f
          path: .ci-rocm-source
          sparse-checkout: |
            tools
            mcp
          persist-credentials: false
      - name: Stage pinned codec candidate for optional offline compilation
        if: inputs.codec_candidate == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ROCm/hipCOMP-core
          ref: 03df9f7369211ee15d370817165224c73fdc9a46
          path: .ci-hipcomp-source
          persist-credentials: false
      - name: Stage exact independent CPU decoder only for its explicit fixture
        if: inputs.cpu_lz4 == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lz4/lz4
          ref: aa4647fad575d01a874aaaadcdbe8e6a40e072f5
          path: .ci-sdk-lz4
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          check-latest: true
      - name: Prepare exact job-local CMake
        run: python tools/ci/prepare_hosted_tools.py cmake
      - name: Qualify current ROCm SDK, filesystem kernel and worker admission
        env:
          FLITZFS_CODEC_CANDIDATE: ${{ inputs.codec_candidate && 'hipcomp' || 'none' }}
          FLITZFS_NATIVE_SYNC_CANDIDATE: ${{ inputs.native_sync_candidate && 'enabled' || 'none' }}
          FLITZFS_LINK_CANDIDATE: ${{ inputs.link_candidate && 'enabled' || 'none' }}
          FLITZFS_CPU_LZ4: ${{ inputs.cpu_lz4 && 'enabled' || 'none' }}
        run: |
          $taskSdkArguments=@('-B','tools/ci/qualify_rocm_sdk.py',
            '--provider','.ci-rocm-source','--output',"${{ runner.temp }}/flitzfs-rocm-sdk")
          if($env:FLITZFS_CODEC_CANDIDATE -eq 'hipcomp'){
            $taskSdkArguments+=@('--hipcomp-source','.ci-hipcomp-source')
          }elseif($env:FLITZFS_CODEC_CANDIDATE -ne 'none'){throw 'Unreviewed codec candidate'}
          if($env:FLITZFS_NATIVE_SYNC_CANDIDATE -eq 'enabled'){
            if($env:FLITZFS_CODEC_CANDIDATE -ne 'hipcomp'){throw 'Native-sync requires the original candidate'}
            $taskSdkArguments+='--hipcomp-native-sync'
          }elseif($env:FLITZFS_NATIVE_SYNC_CANDIDATE -ne 'none'){throw 'Unreviewed native-sync mode'}
          if($env:FLITZFS_LINK_CANDIDATE -eq 'enabled'){
            if($env:FLITZFS_NATIVE_SYNC_CANDIDATE -ne 'enabled'){throw 'Private linking requires native synchronization'}
            $taskSdkArguments+='--hipcomp-link-candidate'
          }elseif($env:FLITZFS_LINK_CANDIDATE -ne 'none'){throw 'Unreviewed private link mode'}
          if($env:FLITZFS_CPU_LZ4 -eq 'enabled'){
            if($env:FLITZFS_LINK_CANDIDATE -ne 'enabled'){throw 'CPU decoder requires the private link fixture'}
            $taskSdkArguments+=@('--cpu-lz4-source','.ci-sdk-lz4')
          }elseif($env:FLITZFS_CPU_LZ4 -ne 'none'){throw 'Unreviewed CPU decoder mode'}
          & python @taskSdkArguments
          if($LASTEXITCODE){throw 'ROCm qualification failed'}
      - name: Retain identities and failures, never SDK or kernel binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rocm-sdk-qualification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/flitzfs-rocm-sdk/qualification.json
            ${{ runner.temp }}/flitzfs-rocm-sdk/hipcomp-offline/qualification.json
            ${{ runner.temp }}/flitzfs-rocm-sdk/hipcomp-native-sync/qualification.json
            ${{ runner.temp }}/flitzfs-rocm-sdk/hipcomp-bounded-entry/qualification.json
            ${{ runner.temp }}/flitzfs-rocm-sdk/hipcomp-bounded-entry/compile-input/notices/**
            ${{ runner.temp }}/flitzfs-rocm-sdk/hipcomp-native-sync/compile-input/notices/**
            ${{ runner.temp }}/flitzfs-rocm-sdk/hipcomp-offline/compile-input/notices/**
            ${{ runner.temp }}/flitzfs-rocm-sdk/cpu-lz4-source/LICENSE
            ${{ runner.temp }}/flitzfs-rocm-sdk/cpu-lz4-source/LICENSE-repository
            ${{ runner.temp }}/flitzfs-rocm-sdk/sdk-cache/verified-distribution.json
            ${{ runner.temp }}/flitzfs-*-provision.json
          retention-days: 30
          if-no-files-found: warn

      - name: Retain experimental own-binary driver diagnostic without AMD runtime
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: driver-probe-${{ github.sha }}
          path: ${{ runner.temp }}/flitzfs-rocm-sdk/driver-probe.zip
          retention-days: 7
          if-no-files-found: error
