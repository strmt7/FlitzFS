name: Official dependency and Dependabot inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/ci/dependency_audit.py'
      - 'CMakeLists.txt'
      - 'third_party/**'
permissions:
  contents: read
  security-events: read
jobs:
  native-api-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Capture exact release identities and open-alert pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/dependency_audit.py --output "${{ runner.temp }}/flitzfs-dependency-audit"
      - name: Retain native successes and access failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ github.sha }}
          path: ${{ runner.temp }}/flitzfs-dependency-audit
          if-no-files-found: error
          retention-days: 30
