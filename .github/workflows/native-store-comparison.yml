name: Native compressed-store RAM comparison
on:
  push:
    branches: [main]
    paths:
      - 'tools/ci/prepare_hosted_tools.py'
      - 'tools/ci/build_linux_codecs.py'
      - 'src/**'
      - 'include/**'
      - 'third_party/**'
      - 'tools/ci/verify_*.py'
      - 'tests/store_comparison.cpp'
      - 'tests/store_reference/**'
      - 'tools/ci/compare_native_store.py'
      - '.github/workflows/native-store-comparison.yml'
      - 'CMakeLists.txt'
permissions:
  contents: read
jobs:
  ram-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use current stable Python for build tooling
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          check-latest: true
      - name: Verify owned-fixture tool provisioning guards
        run: python tools/ci/test_hosted_tools.py
      - name: Stage official checksum-pinned CMake
        run: python tools/ci/prepare_hosted_tools.py cmake
      - name: Stage current official LLVM CPU tools on Linux
        if: runner.os == 'Linux'
        run: python tools/ci/prepare_hosted_tools.py llvm
      - name: Retain exact tool provisioning evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-${{ github.job }}-${{ runner.os }}-${{ strategy.job-index || 0 }}-${{ github.sha }}
          path: ${{ runner.temp }}/flitzfs-*-provision.json
          retention-days: 14
          if-no-files-found: warn
      - name: Verify source provenance and filesystem scope
        run: |
          python tools/ci/verify_blake3_sources.py
          python tools/ci/verify_filesystem_scope.py
      - name: Check out exact native storage baseline without modifying it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: strmt7/FlitzFS
          ref: 5c7d7a0a1aea82cbcf3f8d70b1a1d340a00d2f1e
          path: .ci-deps/store-baseline
          persist-credentials: false
      - name: Check out exact compressed-engine reference for controlled comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: strmt7/FlitzFS
          ref: 56475daedbfc4b0c96683cf1faeaff5414479876
          path: .ci-deps/compressed-reference
          persist-credentials: false
      - name: Check out latest pinned Zstandard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: meta/zstd
          ref: f8745da6ff1ad1e7bab384bd1f9d742439278e99 # v1.5.7
          path: .ci-deps/zstd
          persist-credentials: false
      - name: Check out latest pinned LZ4 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lz4/lz4
          ref: aa4647fad575d01a874aaaadcdbe8e6a40e072f5 # v1.11.1
          path: .ci-deps/lz4
          persist-credentials: false
      - name: Build source-pinned bounded native codecs
        run: python tools/ci/build_linux_codecs.py
      - name: Configure baseline and candidate
        run: |
          cmake -C .ci-deps/linux-codecs/codec-cache.cmake -S tests/store_reference -B build-store-baseline -DCMAKE_BUILD_TYPE=Release -DFLITZFS_REFERENCE_SOURCE="$PWD/.ci-deps/store-baseline"
          cmake -C .ci-deps/linux-codecs/codec-cache.cmake -S tests/store_reference -B build-compressed-reference -DCMAKE_BUILD_TYPE=Release -DFLITZFS_REFERENCE_SOURCE="$PWD/.ci-deps/compressed-reference"
          cmake -C .ci-deps/linux-codecs/codec-cache.cmake -S . -B build-store-compare -DCMAKE_BUILD_TYPE=Release -DFLITZFS_BUILD_TESTS=OFF -DFLITZFS_WITH_LZ4=OFF -DFLITZFS_REQUIRE_ZSTD=ON -DFLITZFS_BUILD_STORE_COMPARISON=ON
      - name: Build with at most two workers
        run: |
          cmake --build build-store-baseline --target flitzfs_reference_store_comparison --parallel 2
          cmake --build build-compressed-reference --target flitzfs_reference_store_comparison --parallel 2
          cmake --build build-store-compare --target flitzfs_store_comparison --parallel 2
      - name: Compare bounded native transactions and cross-read raw images
        run: >-
          python tools/ci/compare_native_store.py
          --baseline build-store-baseline/flitzfs_reference_store_comparison
          --candidate build-store-compare/flitzfs_store_comparison
          --prior build-compressed-reference/flitzfs_reference_store_comparison
          --output "${{ runner.temp }}/flitzfs-native-store-comparison.json"
      - name: Retain source-bound measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-store-comparison-${{ github.sha }}
          path: ${{ runner.temp }}/flitzfs-native-store-comparison.json
          if-no-files-found: error
          retention-days: 30
