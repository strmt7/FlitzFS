name: Bounded CPU pipeline comparison
on:
  push:
    branches: [main]
    paths:
      - 'tools/ci/prepare_hosted_tools.py'
      - 'tools/ci/build_linux_codecs.py'
      - 'src/container.cpp'
      - 'include/flitzfs/container.hpp'
      - 'tools/ci/compare_cpu_pipeline.py'
      - '.github/workflows/cpu-pipeline.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use current stable Python for build tooling
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          check-latest: true
      - name: Verify owned-fixture tool provisioning guards
        run: python tools/ci/test_hosted_tools.py
      - name: Stage official checksum-pinned CMake
        run: python tools/ci/prepare_hosted_tools.py cmake
      - name: Stage current official LLVM CPU tools on Linux
        if: runner.os == 'Linux'
        run: python tools/ci/prepare_hosted_tools.py llvm
      - name: Retain exact tool provisioning evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-${{ github.job }}-${{ runner.os }}-${{ strategy.job-index || 0 }}-${{ github.sha }}
          path: ${{ runner.temp }}/flitzfs-*-provision.json
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2cf06327c6d71ebdfe90aadbed9187f8921a7267
          path: .ci-baseline
          persist-credentials: false
      - name: Check out latest pinned Zstandard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: meta/zstd
          ref: f8745da6ff1ad1e7bab384bd1f9d742439278e99 # v1.5.7
          path: .ci-deps/zstd
          persist-credentials: false
      - name: Check out latest pinned LZ4 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lz4/lz4
          ref: aa4647fad575d01a874aaaadcdbe8e6a40e072f5 # v1.11.1
          path: .ci-deps/lz4
          persist-credentials: false
      - name: Build source-pinned bounded native codecs
        run: python tools/ci/build_linux_codecs.py
      - name: Build both CPU implementations with identical options
        run: |
          cmake -C .ci-deps/linux-codecs/codec-cache.cmake -S .ci-baseline -B baseline-build -DCMAKE_BUILD_TYPE=Release -DFLITZFS_BUILD_TESTS=OFF -DFLITZFS_REQUIRE_ZSTD=ON -DFLITZFS_WITH_ZLIB=OFF -DFLITZFS_WITH_LZ4=OFF
          cmake --build baseline-build --parallel 2
          cmake -C .ci-deps/linux-codecs/codec-cache.cmake -S . -B candidate-build -DCMAKE_BUILD_TYPE=Release -DFLITZFS_BUILD_TESTS=OFF -DFLITZFS_REQUIRE_ZSTD=ON -DFLITZFS_WITH_ZLIB=OFF -DFLITZFS_WITH_LZ4=OFF
          cmake --build candidate-build --parallel 2
      - name: Compare alternating synthetic lanes with exact readback
        run: python3 tools/ci/compare_cpu_pipeline.py --baseline baseline-build/flitzfs --candidate candidate-build/flitzfs --output "${{ runner.temp }}/cpu-pipeline.json"
      - name: Retain measured samples, context and byte-parity results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-pipeline-${{ github.sha }}
          path: ${{ runner.temp }}/cpu-pipeline.json
          if-no-files-found: error
          retention-days: 14
