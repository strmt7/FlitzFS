name: Commit-bound source evidence
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use qualified Python for bounded native diagnostics
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          check-latest: true
      - name: Capture native startup failures without rerunning or changing jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/ci/workflow_diagnostics.py
          --head-sha 69aca1c9a09c7f684694ee9498b500fb9594a223
          --head-sha d9e0b712e9e3af783db9b6e8615e92f2612d4f3b
          --output "${{ runner.temp }}/workflow-startup-diagnostics"
      - name: Retain native statuses, annotations and access failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-startup-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/workflow-startup-diagnostics
          if-no-files-found: warn
          retention-days: 14
      - name: Package tracked source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json, pathlib, subprocess
          result = subprocess.run(["git", "ls-tree", "-r", "-l", "-z", "HEAD"],
                                  capture_output=True, check=True, timeout=10)
          if len(result.stdout) > 256 * 1024:
              raise SystemExit("Source inventory byte cap")
          count = total = 0
          for entry in result.stdout.split(b"\0"):
              if not entry:
                  continue
              header, raw_path = entry.split(b"\t", 1)
              mode, kind, oid, raw_size = header.split()
              path = raw_path.decode("utf-8", "strict")
              parts = pathlib.PurePosixPath(path)
              if mode not in (b"100644", b"100755") or kind != b"blob":
                  raise SystemExit("Source links/submodules are not admitted")
              if parts.is_absolute() or "\\" in path or ":" in path or any(p in ("", ".", "..") for p in path.split("/")):
                  raise SystemExit("Unsafe source path")
              size = int(raw_size)
              count += 1
              total += size
              if size > 2 * 1024 * 1024 or count > 512 or total > 8 * 1024 * 1024:
                  raise SystemExit("Source file/count/expanded cap")
          print(json.dumps({"tracked_files": count, "expanded_bytes": total,
                            "compressed_cap": 4 * 1024 * 1024}))
          PY
          git archive -9 --format=zip HEAD -o "$RUNNER_TEMP/flitzfs-source.zip"
          source_bytes="$(stat -c '%s' "$RUNNER_TEMP/flitzfs-source.zip")"
          printf 'Tracked source archive bytes: %s\n' "$source_bytes"
          test "$source_bytes" -le 4194304
          python - "$RUNNER_TEMP/flitzfs-source.zip" <<'PY'
          import json, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              entries = archive.infolist()
              if len(entries) > 768 or sum(e.file_size for e in entries) > 8 * 1024 * 1024:
                  raise SystemExit("Source ZIP entry/expanded cap")
              if any(e.file_size > 2 * 1024 * 1024 for e in entries):
                  raise SystemExit("Source ZIP per-entry cap")
              print(json.dumps({"zip_entries": len(entries), "expanded_bytes": sum(e.file_size for e in entries)}))
          PY
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/source-commit.txt"
          cd "$RUNNER_TEMP"
          sha256sum flitzfs-source.zip > source-sha256.txt
      - name: Retain exact source without binaries or SDKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/flitzfs-source.zip
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/source-sha256.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
