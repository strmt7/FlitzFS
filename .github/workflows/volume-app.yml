name: Experimental Windows volume application qualification
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'tools/ci/build_windows_native.ps1'
      - 'tools/ci/prepare_hosted_tools.py'
      - 'tools/ci/check_volume_app.py'
      - 'tools/ci/check_portable_cpu.py'
      - '.github/workflows/volume-app.yml'
permissions:
  contents: read
jobs:
  application:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15'
          check-latest: true
      - name: Verify guarded tool provisioning
        run: python tools/ci/test_hosted_tools.py
      - name: Stage checksum-pinned current CMake
        run: python tools/ci/prepare_hosted_tools.py cmake
      - name: Verify pinned digest source
        run: python tools/ci/verify_blake3_sources.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: meta/zstd
          ref: f8745da6ff1ad1e7bab384bd1f9d742439278e99
          path: .ci-deps/zstd
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lz4/lz4
          ref: aa4647fad575d01a874aaaadcdbe8e6a40e072f5
          path: .ci-deps/lz4
          persist-credentials: false
      - name: Build isolated portable application without WinFsp SDK or driver
        run: ./tools/ci/build_windows_native.ps1 -PortableCpu -VolumeApp
      - name: Audit explicit native GUI executable dependencies
        shell: pwsh
        run: |
          $ownedId = [guid]::NewGuid().ToString('N')
          $receipt = Join-Path $env:RUNNER_TEMP ("flitzfs-volume-app-" + $ownedId + ".json")
          $notices = Join-Path $env:RUNNER_TEMP ("flitzfs-volume-notices-" + $ownedId)
          python tools/ci/check_volume_app.py --app build-portable/Release/flitzfs_volume_app.exe --harness build-portable/Release/flitzfs_volume_app_tests.exe --receipt $receipt --notices $notices
          if ($LASTEXITCODE) { throw 'Application dependency audit failed' }
          "FLITZFS_APP_RECEIPT=$receipt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FLITZFS_APP_NOTICES=$notices" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify notice copies and reject reuse without changing evidence
        shell: python
        run: |
          import hashlib, json, os, runpy, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tools/ci").resolve()))
          module = runpy.run_path("tools/ci/check_volume_app.py", run_name="notice_qualification")
          receipt_path = Path(os.environ["FLITZFS_APP_RECEIPT"])
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          directory = Path(os.environ["FLITZFS_APP_NOTICES"])
          assert len(receipt["notices"]) == 7
          before = {p.name: p.read_bytes() for p in directory.iterdir()}
          assert set(before) == {r["file"] for r in receipt["notices"]}
          for row in receipt["notices"]:
              data = before[row["file"]]
              assert len(data) == row["bytes"] and hashlib.sha256(data).hexdigest() == row["sha256"]
          source = before["SOURCE.txt"].decode("utf-8")
          assert ("https://github.com/strmt7/FlitzFS/tree/" + os.environ["GITHUB_SHA"]) in source
          assert len(source.splitlines()) == 6
          old_receipt = receipt_path.read_bytes()
          try:
              module["copy_notices"](directory, os.environ["GITHUB_SHA"])
          except FileExistsError:
              pass
          else:
              raise RuntimeError("Existing notice directory was accepted")
          assert before == {p.name: p.read_bytes() for p in directory.iterdir()}
          assert receipt_path.read_bytes() == old_receipt
          print("Verified seven byte-exact notices/source records; existing output rejected without mutation")
      - name: Exercise provider, real volume and controller ownership
        run: ./build-portable/Release/flitzfs_volume_app_tests.exe --model
      - name: Exercise native GUI file workflow and verified process retirement
        shell: pwsh
        run: |
          $app = (Resolve-Path 'build-portable/Release/flitzfs_volume_app.exe').Path
          & ./build-portable/Release/flitzfs_volume_app_tests.exe --gui $app
          if ($LASTEXITCODE) { throw 'Native application GUI qualification failed' }
      - name: Retain experimental exact-source executables
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: experimental-volume-app-${{ github.sha }}
          path: |
            build-portable/Release/flitzfs_volume_app.exe
            build-portable/Release/flitzfs_volume_app_tests.exe
            ${{ env.FLITZFS_APP_RECEIPT }}
            ${{ env.FLITZFS_APP_NOTICES }}
          if-no-files-found: error
          retention-days: 14
