name: Windows runtime digest and same-source RAM comparison
on:
  push:
    branches: [main]
    paths:
      - 'tools/ci/prepare_hosted_tools.py'
      - 'tools/ci/build_linux_codecs.py'
      - 'src/**'
      - 'include/**'
      - 'third_party/**'
      - 'tools/ci/verify_*.py'
      - 'tests/store_comparison.cpp'
      - 'tests/test_digest_dispatch.cpp'
      - 'tests/blake3_masked_dispatch.c'
      - 'tests/hosted_digest_limits.hpp'
      - 'tools/ci/build_digest_comparison.ps1'
      - 'tools/ci/compare_digest_acceleration.py'
      - 'tools/ci/test_digest_comparison_reports.py'
      - 'tests/store_reference/**'
      - 'tools/ci/compare_native_store.py'
      - '.github/workflows/digest-acceleration.yml'
      - 'CMakeLists.txt'
permissions:
  contents: read
jobs:
  digest-comparison:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use current stable Python for build tooling
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          check-latest: true
      - name: Verify owned-fixture tool provisioning guards
        run: python tools/ci/test_hosted_tools.py
      - name: Stage official checksum-pinned CMake
        run: python tools/ci/prepare_hosted_tools.py cmake
      - name: Stage current official LLVM CPU tools on Linux
        if: runner.os == 'Linux'
        run: python tools/ci/prepare_hosted_tools.py llvm
      - name: Retain exact tool provisioning evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-${{ github.job }}-${{ runner.os }}-${{ strategy.job-index || 0 }}-${{ github.sha }}
          path: ${{ runner.temp }}/flitzfs-*-provision.json
          retention-days: 14
          if-no-files-found: warn
      - name: Verify source provenance and filesystem scope
        run: |
          python tools/ci/verify_blake3_sources.py
          python tools/ci/verify_filesystem_scope.py
      - name: Check out latest pinned Zstandard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: meta/zstd
          ref: f8745da6ff1ad1e7bab384bd1f9d742439278e99 # v1.5.7
          path: .ci-deps/zstd
          persist-credentials: false
      - name: Verify complete and hostile comparison reports
        run: python tools/ci/test_digest_comparison_reports.py
      - name: Build identical source with runtime SIMD and explicit scalar fallback
        shell: pwsh
        run: ./tools/ci/build_digest_comparison.ps1
      - name: Compare bounded CPU digests and byte-exact native RAM objects
        run: python tools/ci/compare_digest_acceleration.py --output "${{ runner.temp }}/flitzfs-digest-comparison.json"
      - name: Retain exact source measurements and any failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-acceleration-${{ github.sha }}
          path: |
            ${{ runner.temp }}/flitzfs-digest-comparison.json
            build-digest-*/Testing/Temporary/LastTest.log
            build-digest-*/CMakeCache.txt
          if-no-files-found: error
          retention-days: 30
