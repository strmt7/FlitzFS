      - name: Check out pinned Zstandard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: meta/zstd
          ref: f8745da6ff1ad1e7bab384bd1f9d742439278e99 # v1.5.7
          path: .ci-deps/zstd
          persist-credentials: false
      - name: Check out pinned LZ4 native dictionary decoder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lz4/lz4
          ref: aa4647fad575d01a874aaaadcdbe8e6a40e072f5 # v1.11.1
          path: .ci-deps/lz4
          persist-credentials: false
      - name: Build bounded writable mount probe
        shell: pwsh
        run: ./tools/ci/build_windows_native.ps1 -BuildWriteProbe
      - name: Provision driver on this disposable hosted VM only
        shell: pwsh
        run: ./tools/ci/provision_disposable_winfsp.ps1
      - name: Retain actual driver identity and signature evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winfsp-write-driver-${{ matrix.profile }}-${{ github.sha }}
          path: ${{ runner.temp }}/flitzfs-sdk-*/driver-provenance.json
          if-no-files-found: warn
          retention-days: 30
      - name: Exercise writable I/O, explicit Flush and independent CPU reopen under process limits
        shell: pwsh
        run: |
          $mode = switch ('${{ matrix.profile }}') {
            'basic' { '--run-disposable-ci' }
            'mutations' { '--run-mutations-ci' }
            'delete' { '--run-delete-ci' }
            'crash' { '--run-crash-ci' }
            'restart' { '--run-restart-ci' }
            'crash-restart' { '--run-crash-restart-ci' }
            default { throw 'Invalid fixed writable profile' }
          }
          ./build-native/Release/flitzfs_write_probe.exe $mode
          if ($LASTEXITCODE) { throw 'Supervised writable mount probe failed' }

      - name: Reconcile exact acknowledged writable state and source identity
        run: python tools/ci/verify_windows_write_probe.py --profile ${{ matrix.profile }}

      - name: Retain source-bound writable fixture observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-write-${{ matrix.profile }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/flitzfs-write-probe-*/write.json
            ${{ runner.temp }}/flitzfs-write-probe-*/verify.json
            ${{ runner.temp }}/flitzfs-write-probe-*/state.json
            ${{ runner.temp }}/flitzfs-write-probe-*/state-verify.json
          if-no-files-found: warn
          retention-days: 14
