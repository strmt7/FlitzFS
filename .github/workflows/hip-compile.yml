name: Pinned ROCm SDK compile qualification (no GPU)
on:
  push:
    branches: [main]
    paths:
      - 'tools/rocm-sdk-lock.json'
      - 'tools/ci/qualify_rocm_sdk.py'
      - 'tests/rocm_compile/**'
      - 'src/gpu/**'
      - 'include/flitzfs/gpu_protocol.hpp'
      - '.github/workflows/hip-compile.yml'
permissions:
  contents: read
jobs:
  complete-rocm-compile:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage current reviewed FlitzZip toolchain mechanisms unchanged
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: strmt7/FlitzZip
          ref: 113ca5f30655f0d373c17d1448e35ce1b69f2819
          path: .ci-rocm-source
          sparse-checkout: |
            tools
            mcp
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          check-latest: true
      - name: Prepare exact job-local CMake
        run: python tools/ci/prepare_hosted_tools.py cmake
      - name: Qualify complete current ROCm SDK and native filesystem kernel
        run: >-
          python -B tools/ci/qualify_rocm_sdk.py
          --provider ".ci-rocm-source"
          --output "${{ runner.temp }}/flitzfs-rocm-sdk"
      - name: Retain identities and failures, never SDK or kernel binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rocm-sdk-qualification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/flitzfs-rocm-sdk/qualification.json
            ${{ runner.temp }}/flitzfs-rocm-sdk/sdk-cache/verified-distribution.json
            ${{ runner.temp }}/flitzfs-*-provision.json
          retention-days: 30
          if-no-files-found: warn
