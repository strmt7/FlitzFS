name: Safe CPU and native callback checks
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            zstd: 'ON'
          - os: ubuntu-24.04
            zstd: 'OFF'
          - os: windows-2025-vs2026
            zstd: 'OFF'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use current stable Python for build tooling
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          check-latest: true
      - name: Verify owned-fixture tool provisioning guards
        run: python tools/ci/test_hosted_tools.py
      - name: Stage official checksum-pinned CMake
        run: python tools/ci/prepare_hosted_tools.py cmake
      - name: Stage current official LLVM CPU tools on Linux
        if: runner.os == 'Linux'
        run: python tools/ci/prepare_hosted_tools.py llvm
      - name: Retain exact tool provisioning evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-${{ github.job }}-${{ runner.os }}-${{ strategy.job-index || 0 }}-${{ github.sha }}
          path: ${{ runner.temp }}/flitzfs-*-provision.json
          retention-days: 14
          if-no-files-found: warn
      - name: Verify filesystem product scope
        run: python tools/ci/verify_filesystem_scope.py
      - name: Verify pinned digest source bytes before building
        run: python tools/ci/verify_blake3_sources.py
      - name: Check out latest pinned Zstandard source
        if: runner.os == 'Linux' && matrix.zstd == 'ON'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: meta/zstd
          ref: f8745da6ff1ad1e7bab384bd1f9d742439278e99 # v1.5.7
          path: .ci-deps/zstd
          persist-credentials: false
      - name: Check out latest pinned LZ4 source
        if: runner.os == 'Linux' && matrix.zstd == 'ON'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lz4/lz4
          ref: aa4647fad575d01a874aaaadcdbe8e6a40e072f5 # v1.11.1
          path: .ci-deps/lz4
          persist-credentials: false
      - name: Build source-pinned bounded native codecs
        if: runner.os == 'Linux' && matrix.zstd == 'ON'
        run: python tools/ci/build_linux_codecs.py
      - name: Check out exact native write-reuse baseline
        if: runner.os == 'Linux' && matrix.zstd == 'OFF'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: strmt7/FlitzFS
          ref: 94d0b3d85764843c6d7855c889137c8ea103689d
          path: .ci-deps/reuse-baseline
          persist-credentials: false
      - name: Configure minimal build
        if: matrix.zstd == 'OFF'
        run: cmake -S . -B build -DFLITZFS_PORTABLE_CPU=ON -DFLITZFS_WITH_ZSTD=${{ matrix.zstd }} -DFLITZFS_REQUIRE_ZSTD=${{ matrix.zstd }} -DFLITZFS_WITH_LZ4=${{ matrix.zstd }} -DFLITZFS_REQUIRE_LZ4=${{ matrix.zstd }} -DCMAKE_BUILD_TYPE=Release
      - name: Configure codec-enabled build
        if: runner.os == 'Linux' && matrix.zstd == 'ON'
        run: >-
          cmake -C .ci-deps/linux-codecs/codec-cache.cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DFLITZFS_REQUIRE_ZSTD=ON -DFLITZFS_REQUIRE_LZ4=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Independently inspect native error runtime handle initialization
        if: runner.os == 'Windows'
        run: ./build/Release/flitzfs_worker_exchange_tests.exe --native-error-resource-probe
      - name: Prove identical-write regression against the immutable baseline
        if: runner.os == 'Linux' && matrix.zstd == 'OFF'
        shell: python
        run: |
          import subprocess
          commands = [
              ["cmake", "-S", ".ci-deps/reuse-baseline", "-B", "build-reuse-baseline",
               "-DFLITZFS_BUILD_TESTS=OFF", "-DFLITZFS_WITH_ZSTD=OFF", "-DFLITZFS_WITH_LZ4=OFF",
               "-DCMAKE_BUILD_TYPE=Release", "-DCMAKE_C_COMPILER=clang", "-DCMAKE_CXX_COMPILER=clang++"],
              ["cmake", "--build", "build-reuse-baseline", "--target", "flitzfs_core", "--parallel", "2"],
              ["clang++", "-std=c++20", "-O2", "-I", "include", "-I", "src",
               "tests/test_native_filesystem.cpp", "build-reuse-baseline/libflitzfs_core.a",
               "build-reuse-baseline/libflitzfs_blake3.a", "-o", "build-reuse-baseline/native-reuse-regression"],
          ]
          for command in commands:
              subprocess.run(command, check=True, timeout=90)
          result = subprocess.run(["build-reuse-baseline/native-reuse-regression"],
                                  capture_output=True, text=True, timeout=45)
          print(result.stdout)
          print(result.stderr)
          if result.returncode != 1 or not result.stderr.strip().endswith(": identical full write replaced payload records"):
              raise RuntimeError("prior implementation did not reproduce the specific write-amplification regression")
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 45 --parallel 1

      - name: Verify exact private-job launch admission and retirement
        if: runner.os == 'Windows' && matrix.zstd == 'OFF'
        run: python tools/ci/test_portable_job_lifecycle.py

      - name: Verify relocated raw-only CPU executable
        if: matrix.zstd == 'OFF'
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          binary = Path("build/Release/flitzfs.exe") if sys.platform == "win32" else Path("build/flitzfs")
          subprocess.run([sys.executable, "tools/ci/check_portable_cpu.py", str(binary), "--codecs", "raw"], check=True, timeout=120)

      - name: Report native staging and worker lifecycle evidence
        if: success()
        shell: python
        run: |
          from pathlib import Path
          for line in Path("build/Testing/Temporary/LastTest.log").read_text(encoding="utf-8").splitlines():
              if line.startswith(("Native global disposition invariants:", "Native global disposition evidence:", "Windows writable-restart evidence:", "Windows writable-cap evidence:", "Windows writable-adapter evidence:", "Windows writable-lifecycle evidence:", "Native staging evidence:", "Native reuse evidence:", "Native lifetime evidence:", "Native lifetime invariants:", "Native session evidence:", "Native session invariants:", "Native session read evidence:", "Native flush evidence:", "Native basic evidence:", "Native basic invariants:", "Native security evidence:", "Native security invariants:", "Native create evidence:", "Native create invariants:", "Native overwrite evidence:", "Native overwrite invariants:", "Native provisional evidence:", "Native provisional invariants:", "Windows provisional evidence:", "Native allocated-event evidence:", "Native allocated-event invariants:", "Windows data-bridge invariants:", "Windows data-bridge faults:", "Windows allocated-event evidence:", "Native allocation evidence:", "Native allocation invariants:", "Native initial-delete evidence:", "Native initial-delete invariants:", "Windows initial-delete evidence:", "Digest dispatch invariants:", "Windows security evidence:", "Windows basic oracle:", "Native Cleanup evidence:", "Native Cleanup invariants:", "WinFsp Cleanup evidence:", "Native mutation metadata evidence:", "Native mutation metadata invariants:", "Native result seal:", "Native result evidence:", "Compact checkpoint faults:", "Compact checkpoint invariants:", "Compact checkpoint profile:", "Compact checkpoint file evidence:", "handle_totals ")) or "real Windows worker exchange checks" in line:
                  print(line)
      - name: Retain bounded CPU test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-tests-${{ runner.os }}-${{ matrix.zstd }}-${{ github.sha }}
          path: |
            build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/flitzfs-portable-*/portability.json
          retention-days: 30
          if-no-files-found: warn

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use current stable Python for build tooling
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          check-latest: true
      - name: Verify owned-fixture tool provisioning guards
        run: python tools/ci/test_hosted_tools.py
      - name: Stage official checksum-pinned CMake
        run: python tools/ci/prepare_hosted_tools.py cmake
      - name: Stage current official LLVM CPU tools on Linux
        if: runner.os == 'Linux'
        run: python tools/ci/prepare_hosted_tools.py llvm
      - name: Retain exact tool provisioning evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-${{ github.job }}-${{ runner.os }}-${{ strategy.job-index || 0 }}-${{ github.sha }}
          path: ${{ runner.temp }}/flitzfs-*-provision.json
          retention-days: 14
          if-no-files-found: warn
      - name: Verify pinned digest source bytes before building
        run: python tools/ci/verify_blake3_sources.py
      - name: Check out latest pinned Zstandard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: meta/zstd
          ref: f8745da6ff1ad1e7bab384bd1f9d742439278e99 # v1.5.7
          path: .ci-deps/zstd
          persist-credentials: false
      - name: Check out latest pinned LZ4 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lz4/lz4
          ref: aa4647fad575d01a874aaaadcdbe8e6a40e072f5 # v1.11.1
          path: .ci-deps/lz4
          persist-credentials: false
      - name: Build source-pinned bounded native codecs
        run: python tools/ci/build_linux_codecs.py --sanitize
      - name: Configure ASan/UBSan
        run: >-
          cmake -C .ci-deps/linux-codecs/codec-cache.cmake -S . -B build-asan -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug -DFLITZFS_REQUIRE_ZSTD=ON -DFLITZFS_REQUIRE_LZ4=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan --parallel 2
      - name: Check with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure --timeout 45 --parallel 1

      - name: Report native staging and worker lifecycle evidence
        if: success()
        shell: python
        run: |
          from pathlib import Path
          for line in Path("build-asan/Testing/Temporary/LastTest.log").read_text(encoding="utf-8").splitlines():
              if line.startswith(("Native global disposition invariants:", "Native global disposition evidence:", "Windows writable-restart evidence:", "Windows writable-cap evidence:", "Windows writable-adapter evidence:", "Windows writable-lifecycle evidence:", "Native staging evidence:", "Native reuse evidence:", "Native lifetime evidence:", "Native lifetime invariants:", "Native session evidence:", "Native session invariants:", "Native session read evidence:", "Native flush evidence:", "Native basic evidence:", "Native basic invariants:", "Native security evidence:", "Native security invariants:", "Native create evidence:", "Native create invariants:", "Native overwrite evidence:", "Native overwrite invariants:", "Native provisional evidence:", "Native provisional invariants:", "Windows provisional evidence:", "Native allocated-event evidence:", "Native allocated-event invariants:", "Windows data-bridge invariants:", "Windows data-bridge faults:", "Windows allocated-event evidence:", "Native allocation evidence:", "Native allocation invariants:", "Native initial-delete evidence:", "Native initial-delete invariants:", "Windows initial-delete evidence:", "Digest dispatch invariants:", "Windows security evidence:", "Windows basic oracle:", "Native Cleanup evidence:", "Native Cleanup invariants:", "WinFsp Cleanup evidence:", "Native mutation metadata evidence:", "Native mutation metadata invariants:", "Native result seal:", "Native result evidence:", "Compact checkpoint faults:", "Compact checkpoint invariants:", "Compact checkpoint profile:", "Compact checkpoint file evidence:", "handle_totals ")) or "real Windows worker exchange checks" in line:
                  print(line)
      - name: Retain sanitizer test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizer-tests-${{ github.sha }}
          path: build-asan/Testing/Temporary/LastTest.log
          retention-days: 30
          if-no-files-found: warn

  windows-native:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use current stable Python for build tooling
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          check-latest: true
      - name: Verify owned-fixture tool provisioning guards
        run: python tools/ci/test_hosted_tools.py
      - name: Stage official checksum-pinned CMake
        run: python tools/ci/prepare_hosted_tools.py cmake
      - name: Stage current official LLVM CPU tools on Linux
        if: runner.os == 'Linux'
        run: python tools/ci/prepare_hosted_tools.py llvm
      - name: Retain exact tool provisioning evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-${{ github.job }}-${{ runner.os }}-${{ strategy.job-index || 0 }}-${{ github.sha }}
          path: ${{ runner.temp }}/flitzfs-*-provision.json
          retention-days: 14
          if-no-files-found: warn
      - name: Verify pinned digest source bytes before building
        run: python tools/ci/verify_blake3_sources.py
      - name: Stage checksum-pinned SDK without installation
        shell: pwsh
        run: ./tools/ci/prepare_winfsp_sdk.ps1
      - name: Retain exact SDK candidate provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winfsp-sdk-${{ github.job }}-${{ github.sha }}
          path: ${{ env.FLITZFS_WINFSP_PROVENANCE }}
          if-no-files-found: warn
          retention-days: 30
      - name: Check out pinned Zstandard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: meta/zstd
          ref: f8745da6ff1ad1e7bab384bd1f9d742439278e99 # v1.5.7
          path: .ci-deps/zstd
          persist-credentials: false
      - name: Check out pinned LZ4 native dictionary decoder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lz4/lz4
          ref: aa4647fad575d01a874aaaadcdbe8e6a40e072f5 # v1.11.1
          path: .ci-deps/lz4
          persist-credentials: false
      - name: Reject partial, mixed or rolled-back writable reports before live trials
        run: python tools/ci/test_windows_write_probe.py
      - name: Verify strict Windows space report reconciliation
        run: python tools/ci/test_windows_space_reports.py
      - name: Build pinned CPU codec and native callbacks
        shell: pwsh
        run: ./tools/ci/build_windows_native.ps1
      - name: Independently inspect native error runtime handle initialization
        run: ./build-native/Release/flitzfs_worker_exchange_tests.exe --native-error-resource-probe
      - name: Exercise actual callbacks without a mounted filesystem
        run: ctest --test-dir build-native -C Release --output-on-failure --timeout 45 --parallel 1

      - name: Compile writable probe without launching any mount
        shell: pwsh
        run: ./tools/ci/build_windows_native.ps1 -BuildWriteProbe

      - name: Report native staging and worker lifecycle evidence
        if: success()
        shell: python
        run: |
          from pathlib import Path
          for line in Path("build-native/Testing/Temporary/LastTest.log").read_text(encoding="utf-8").splitlines():
              if line.startswith(("Native global disposition invariants:", "Native global disposition evidence:", "Windows writable-restart evidence:", "Windows writable-cap evidence:", "Windows writable-adapter evidence:", "Windows writable-lifecycle evidence:", "Native staging evidence:", "Native reuse evidence:", "Native lifetime evidence:", "Native lifetime invariants:", "Native session evidence:", "Native session invariants:", "Native session read evidence:", "Native flush evidence:", "Native basic evidence:", "Native basic invariants:", "Native security evidence:", "Native security invariants:", "Native create evidence:", "Native create invariants:", "Native overwrite evidence:", "Native overwrite invariants:", "Native provisional evidence:", "Native provisional invariants:", "Windows provisional evidence:", "Native allocated-event evidence:", "Native allocated-event invariants:", "Windows data-bridge invariants:", "Windows data-bridge faults:", "Windows allocated-event evidence:", "Native allocation evidence:", "Native allocation invariants:", "Native initial-delete evidence:", "Native initial-delete invariants:", "Windows initial-delete evidence:", "Digest dispatch invariants:", "Windows security evidence:", "Windows basic oracle:", "Native Cleanup evidence:", "Native Cleanup invariants:", "WinFsp Cleanup evidence:", "Native mutation metadata evidence:", "Native mutation metadata invariants:", "Native result seal:", "Native result evidence:", "Compact checkpoint faults:", "Compact checkpoint invariants:", "Compact checkpoint profile:", "Compact checkpoint file evidence:", "handle_totals ")) or "real Windows worker exchange checks" in line:
                  print(line)
      - name: Retain native Windows test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-windows-tests-${{ github.sha }}
          path: build-native/Testing/Temporary/LastTest.log
          retention-days: 30
          if-no-files-found: warn


  windows-mount:
    needs: [cpu, sanitizers, windows-native]
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    env:
      FLITZFS_ALLOW_DISPOSABLE_MOUNT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use current stable Python for build tooling
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          check-latest: true
      - name: Verify owned-fixture tool provisioning guards
        run: python tools/ci/test_hosted_tools.py
      - name: Stage official checksum-pinned CMake
        run: python tools/ci/prepare_hosted_tools.py cmake
      - name: Stage current official LLVM CPU tools on Linux
        if: runner.os == 'Linux'
        run: python tools/ci/prepare_hosted_tools.py llvm
      - name: Retain exact tool provisioning evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-${{ github.job }}-${{ runner.os }}-${{ strategy.job-index || 0 }}-${{ github.sha }}
          path: ${{ runner.temp }}/flitzfs-*-provision.json
          retention-days: 14
          if-no-files-found: warn
      - name: Verify pinned digest source bytes before building
        run: python tools/ci/verify_blake3_sources.py
      - name: Stage checksum-pinned SDK without installation
        shell: pwsh
        run: ./tools/ci/prepare_winfsp_sdk.ps1
      - name: Retain exact SDK candidate provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winfsp-sdk-${{ github.job }}-${{ github.sha }}
          path: ${{ env.FLITZFS_WINFSP_PROVENANCE }}
          if-no-files-found: warn
          retention-days: 30
      - name: Check out pinned Zstandard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: meta/zstd
          ref: f8745da6ff1ad1e7bab384bd1f9d742439278e99 # v1.5.7
          path: .ci-deps/zstd
          persist-credentials: false
      - name: Check out pinned LZ4 native dictionary decoder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lz4/lz4
          ref: aa4647fad575d01a874aaaadcdbe8e6a40e072f5 # v1.11.1
          path: .ci-deps/lz4
          persist-credentials: false
      - name: Build synthetic mount probe
        shell: pwsh
        run: ./tools/ci/build_windows_native.ps1 -BuildMountProbe
      - name: Provision driver on this disposable hosted VM only
        shell: pwsh
        run: ./tools/ci/provision_disposable_winfsp.ps1
      - name: Retain actual driver identity and signature evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winfsp-driver-${{ github.sha }}
          path: ${{ runner.temp }}/flitzfs-sdk-*/driver-provenance.json
          if-no-files-found: warn
          retention-days: 30
      - name: Exercise actual mounted I/O under process limits
        shell: pwsh
        run: |
          ./build-native/Release/flitzfs_mount_probe.exe --run-disposable-ci
          if ($LASTEXITCODE) { throw 'Supervised mount probe failed' }

      - name: Reconcile all source-bound Windows space observations
        run: python tools/ci/verify_windows_space_reports.py --hosted
      - name: Retain native Windows space observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-space-${{ github.sha }}
          path: ${{ runner.temp }}/flitzfs-probe-*/space-*.json
          if-no-files-found: warn
          retention-days: 14


  windows-write-mount:
    needs: [cpu, sanitizers, windows-native, windows-mount]
    strategy:
      fail-fast: false
      matrix:
        profile: [basic, mutations, delete, crash, restart, crash-restart]
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    env:
      FLITZFS_ALLOW_DISPOSABLE_MOUNT: '1'
      FLITZFS_ALLOW_DISPOSABLE_WRITE: '1'
