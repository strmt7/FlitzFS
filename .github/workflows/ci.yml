name: Safe CPU core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Zstandard headers (Ubuntu only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev
      - name: Configure
        run: cmake -S . -B build -DFLITZFS_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 45

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install CPU dependencies
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev clang
      - name: Configure ASan/UBSan
        run: >-
          cmake -S . -B build-asan -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build with small parallelism
        run: cmake --build build-asan --parallel 2
      - name: Check with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure --timeout 45
