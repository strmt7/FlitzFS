name: Bounded locked-RAM host-probe qualification
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'tools/ci/build_windows_native.ps1'
      - 'tools/ci/prepare_hosted_tools.py'
      - '.github/workflows/ram-host.yml'
permissions:
  contents: read
jobs:
  locked-ram:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15'
          check-latest: true
      - name: Verify guarded tool provisioning
        run: python tools/ci/test_hosted_tools.py
      - name: Stage current checksum-pinned CMake
        run: python tools/ci/prepare_hosted_tools.py cmake
      - name: Verify pinned digest source
        run: python tools/ci/verify_blake3_sources.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: meta/zstd
          ref: f8745da6ff1ad1e7bab384bd1f9d742439278e99
          path: .ci-deps/zstd
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lz4/lz4
          ref: aa4647fad575d01a874aaaadcdbe8e6a40e072f5
          path: .ci-deps/lz4
          persist-credentials: false
      - name: Build self-contained CPU probe without SDK, driver or GPU
        run: ./tools/ci/build_windows_native.ps1 -PortableCpu -RamHostProbe
      - name: Audit self-contained PE dependencies
        shell: python
        run: |
          from pathlib import Path
          import runpy
          audit_binary = runpy.run_path("tools/ci/check_portable_cpu.py", run_name="ram_probe_audit")["audit_binary"]
          print(audit_binary(Path("build-portable/Release/flitzfs_ram_host_probe.exe").read_bytes()))
          print(audit_binary(Path("build-portable/Release/flitzfs_gpu_ram_probe.exe").read_bytes()))
      - name: Exercise bounded real-source and synthetic RAM core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP ("flitzfs-locked-ram-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $fixture -ErrorAction Stop | Out-Null
          $report = Join-Path $fixture 'report.json'
          $probe = (Resolve-Path 'build-portable/Release/flitzfs_ram_host_probe.exe').Path
          & $probe --run $report (Resolve-Path 'README.md').Path (Resolve-Path 'CMakeLists.txt').Path (Resolve-Path 'docs/DEVELOPMENT_STATE.json').Path
          if ($LASTEXITCODE) { throw 'Locked-RAM probe failed; no artifact promotion' }
          $beforeHash = (Get-FileHash -LiteralPath $report -Algorithm SHA256).Hash
          & $probe --run $report
          if ($LASTEXITCODE -ne 1 -or (Get-FileHash -LiteralPath $report -Algorithm SHA256).Hash -ne $beforeHash) { throw 'Existing report was not preserved' }
          $uncontained = Join-Path $fixture 'uncontained.json'
          & $probe --child $uncontained
          if ($LASTEXITCODE -ne 1) { throw 'Uncontained direct child did not reject with the expected status' }
          $denial = Get-Content -LiteralPath $uncontained -Raw | ConvertFrom-Json
          if ($denial.complete -or $denial.locked_after -ne 0 -or -not $denial.cleanup_ok) { throw 'Uncontained child touched locked storage' }
          $data = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($data.commit -ne $env:GITHUB_SHA -or -not $data.complete -or -not $data.resident_verified -or $data.locked_after -ne 0 -or $data.mounted -or $data.gpu) { throw 'RAM evidence mismatch' }
          if ($data.locked_peak -gt 40MB -or $data.handles_before -ne $data.handles_after -or $data.real_files -ne 3) { throw 'RAM resource evidence mismatch' }
          if ($data.real_post.input -ne $data.real_raw.input -or $data.real_post.payload -ne $data.real_raw.payload -or $data.real_post.target_payload -ne $data.real_auto.target_payload -or $data.real_post.target_payload -ge $data.real_raw.payload) { throw 'Real post-compression equivalence/reduction failed' }
          if ($data.synthetic_post.target_payload -ne $data.synthetic_auto.target_payload -or $data.synthetic_post.target_payload -ge $data.synthetic_raw.payload) { throw 'Synthetic post-compression equivalence/reduction failed' }
          $package = Join-Path $env:RUNNER_TEMP 'flitzfs-ram-package'
          New-Item -ItemType Directory -Path $package -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath $probe -Destination (Join-Path $package 'flitzfs_ram_host_probe.exe') -ErrorAction Stop
          Copy-Item -LiteralPath $report -Destination (Join-Path $package 'qualification.json') -ErrorAction Stop
          $licenses = Join-Path $package 'licenses'
          New-Item -ItemType Directory -Path $licenses -ErrorAction Stop | Out-Null
          foreach ($scope in @(@{Name='project';Path=$env:GITHUB_WORKSPACE},@{Name='zstd';Path='.ci-deps/zstd'},@{Name='lz4';Path='.ci-deps/lz4'},@{Name='blake3';Path='third_party/blake3'})) {
            $files = @(Get-ChildItem -LiteralPath $scope.Path -File | Where-Object { $_.Name -match '^(LICENSE|COPYING|NOTICE)' })
            if ($scope.Name -ne 'project' -and $files.Count -eq 0) { throw "Missing dependency license $($scope.Name)" }
            foreach ($file in $files) { Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $licenses ($scope.Name+'-'+$file.Name)) -ErrorAction Stop }
          }
          $packageFiles = @(Get-ChildItem -LiteralPath $package -File -Recurse)
          if ($packageFiles.Count -gt 32 -or ($packageFiles | Measure-Object Length -Sum).Sum -gt 16MB) { throw 'RAM package size/file cap' }
          $hash = (Get-FileHash -LiteralPath $probe -Algorithm SHA256).Hash
          @{experimental=$true;commit=$env:GITHUB_SHA;exe_sha256=$hash;static_runtime=$true;driver_load_performed=$false;gpu_invocation_performed=$false;filesystem_backing='locked_RAM_model';child_mib=128;cpu_rate=2000;timeout_ms=15000;head_bytes=131072} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $package 'provenance.json') -Encoding utf8
          "FLITZFS_RAM_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Both expected failure statuses were checked above. Return this qualification result.
          exit 0
      - name: Qualify native locked-RAM worker composition with CPU fixtures only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gpuRamFixture = Join-Path $env:RUNNER_TEMP ('flitzfs-gpu-native-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $gpuRamFixture -ErrorAction Stop | Out-Null
          "FLITZFS_GPU_RAM_REPORTS=$gpuRamFixture" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $gpuRamProbe = (Resolve-Path 'build-portable/Release/flitzfs_gpu_ram_probe.exe').Path
          $cpuWorker = (Resolve-Path 'build-portable/Release/flitzfs_worker_exchange_tests.exe').Path
          function Invoke-NativeRamFixture([string[]]$ProbeArguments) {
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = $gpuRamProbe
            $start.UseShellExecute = $false
            $start.CreateNoWindow = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            foreach ($argument in $ProbeArguments) { $start.ArgumentList.Add($argument) }
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $start
            $started = $false
            $confirmed = $false
            try {
              $started = $process.Start()
              if (-not $started) { throw 'Native RAM fixture did not start' }
              $stdout = $process.StandardOutput.ReadToEndAsync()
              $stderr = $process.StandardError.ReadToEndAsync()
              $confirmed = $process.WaitForExit(15000)
              if (-not $confirmed) {
                $process.Kill()
                $confirmed = $process.WaitForExit(2000)
                throw 'Native RAM fixture exceeded its qualification wall budget'
              }
              if (-not $stdout.Wait(2000) -or -not $stderr.Wait(2000)) { throw 'Native RAM output retirement failed' }
              if ($stdout.Result.Length -gt 8192 -or $stderr.Result.Length -gt 2048) { throw 'Native RAM output cap' }
              return @{ Exit = $process.ExitCode; Output = $stdout.Result; Error = $stderr.Result }
            } finally {
              try {
                if ($started -and -not $confirmed) {
                  if (-not $process.HasExited) { $process.Kill(); $confirmed = $process.WaitForExit(2000) }
                  if (-not $confirmed) { throw 'Native RAM fixture retirement unconfirmed; no next test' }
                }
              } finally { $process.Dispose() }
            }
          }
          foreach ($fixtureMode in @('match','match-invalid','match-hip-declaration','match-hold')) {
            $newReport = Join-Path $gpuRamFixture ('native-' + $fixtureMode + '.json')
            $result = Invoke-NativeRamFixture @('--cpu-fixture',$newReport,$cpuWorker,$fixtureMode)
            Write-Output $result.Output
            Write-Output $result.Error
            if ($result.Exit -ne 0) { throw "Native RAM composition failed: $fixtureMode" }
            $data = Get-Content -LiteralPath $newReport -Raw | ConvertFrom-Json
            if ($data.commit -ne $env:GITHUB_SHA -or -not $data.complete -or -not $data.cpu_fixture -or $data.gpu_requested -or $data.gpu_result_accepted -or $data.mounted) { throw 'Native RAM fixture source/backend mismatch' }
            if (-not $data.cpu_verified -or -not $data.source_preserved -or -not $data.retained_context_verified -or -not $data.resident_verified -or $data.power_loss_qualified) { throw 'Native RAM fixture evidence mismatch' }
            if ($data.locked_after -ne 0 -or $data.locked_peak -gt 40MB -or $data.handles_before -ne $data.handles_after -or $data.controller_peak_commit_bytes -gt 256MB) { throw 'Native RAM fixture resource/retirement mismatch' }
            if (-not $data.proposed.worker_attempted -or -not $data.proposed.worker_exit_confirmed -or $data.proposed.device_bytes -gt 256KB -or $data.proposed.records -gt 8) { throw 'Native RAM worker bounds mismatch' }
            if ($data.proposed.target_payload -gt $data.proposed.cpu_baseline_payload) { throw 'Proposed encoding exceeded ordinary CPU baseline' }
            if ($fixtureMode -eq 'match') {
              if (-not $data.proposed.worker_accepted -or $data.proposed.forwarded_matches -le 0) { throw 'Valid CPU fixture did not reach native hint encoding' }
            } else {
              if ($data.proposed.worker_accepted -or $data.proposed.forwarded_matches -ne 0 -or $data.proposed.selected_records -ne 0 -or $data.proposed.target_payload -ne $data.cpu_baseline.target_payload) { throw 'Failed worker did not preserve ordinary CPU recompression' }
            }
          }
          $existingReport = Join-Path $gpuRamFixture 'native-match.json'
          $existingHash = (Get-FileHash -LiteralPath $existingReport -Algorithm SHA256).Hash
          $refusal = Invoke-NativeRamFixture @('--cpu-fixture',$existingReport,$cpuWorker,'match')
          if ($refusal.Exit -ne 1 -or (Get-FileHash -LiteralPath $existingReport -Algorithm SHA256).Hash -ne $existingHash) { throw 'Existing native RAM report was modified' }
          $unrecognized = Join-Path $gpuRamFixture 'native-unknown.json'
          $refusal = Invoke-NativeRamFixture @('--unknown',$unrecognized,$cpuWorker,'match')
          if ($refusal.Exit -ne 1 -or (Test-Path -LiteralPath $unrecognized)) { throw 'Unknown native RAM mode touched a report' }
          $invalidLeaf = Join-Path $gpuRamFixture 'ordinary.json'
          $refusal = Invoke-NativeRamFixture @('--cpu-fixture',$invalidLeaf,$cpuWorker,'match')
          if ($refusal.Exit -ne 1 -or (Test-Path -LiteralPath $invalidLeaf)) { throw 'Unqualified report filename was opened' }
          $package = $env:FLITZFS_RAM_PACKAGE
          Copy-Item -LiteralPath $gpuRamProbe -Destination (Join-Path $package 'flitzfs_gpu_ram_probe.exe') -ErrorAction Stop
          foreach ($fixtureReport in Get-ChildItem -LiteralPath $gpuRamFixture -Filter '*.json' -File) {
            Copy-Item -LiteralPath $fixtureReport.FullName -Destination (Join-Path $package $fixtureReport.Name) -ErrorAction Stop
          }
          $gpuRamHash = (Get-FileHash -LiteralPath $gpuRamProbe -Algorithm SHA256).Hash.ToLowerInvariant()
          @{experimental=$true;commit=$env:GITHUB_SHA;exe_sha256=$gpuRamHash;cpu_fixture_only=$true;gpu_executed=$false;mounted=$false;filesystem_backing='locked_RAM_model';controller_job_mib=256;process_mib=128;worker_mib=128;cpu_rate=2000;worker_timeout_ms=5000;one_compute_request=$true} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $package 'native-gpu-ram-provenance.json') -Encoding utf8
          $allFiles = @(Get-ChildItem -LiteralPath $package -Recurse -File)
          if ($allFiles.Count -gt 32 -or ($allFiles | Measure-Object Length -Sum).Sum -gt 16MB) { throw 'Combined RAM package cap' }
          exit 0
      - name: Retain native RAM CPU-fixture failures separately
        if: always() && env.FLITZFS_GPU_RAM_REPORTS != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-gpu-ram-cpu-fixtures-${{ github.sha }}
          path: ${{ env.FLITZFS_GPU_RAM_REPORTS }}/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain qualified experimental probe and provenance
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: locked-ram-probe-${{ github.sha }}
          path: ${{ env.FLITZFS_RAM_PACKAGE }}
          if-no-files-found: error
          retention-days: 7
